<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050811;color:#fff;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:16px;font-weight:800;text-shadow:0 2px 4px #000}
.row{display:flex;gap:14px;align-items:center}.pill{background:#0b1220dd;border:1px solid #ffffff22;border-radius:10px;padding:8px 12px}
#bar{width:190px;height:12px;background:#222;border-radius:8px;overflow:hidden;border:1px solid #ffffff33}.fill{height:100%;width:100%;background:#55e68a}
#ammo{position:fixed;right:20px;bottom:18px;font-size:28px;text-shadow:0 2px 5px #000}#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:28px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;transition:.15s}
#menu,#pause,#over{position:fixed;inset:0;display:grid;place-items:center;background:#02040acc;text-align:center}
.card{width:min(560px,90vw);padding:34px;border:1px solid #ffffff22;background:#0a1020ee;border-radius:22px;box-shadow:0 20px 80px #000}
h1{font-size:48px;margin:0 0 8px}h2{margin:8px 0}p{opacity:.8}button{padding:12px 22px;border:0;border-radius:10px;font-weight:900;font-size:16px;cursor:pointer;margin:5px}
#pause,#over{display:none}.small{font-size:13px;opacity:.7}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu"><div class="card"><h1>NEON STRIKE</h1><p>Survive waves, upgrade your weapons, and defeat the boss.</p><button onclick="start()">START GAME</button><p class="small">WASD / arrows = move · mouse = aim · click / space = fire · R = reload · P = pause</p></div></div>
<div id="pause"><div class="card"><h1>PAUSED</h1><button onclick="togglePause()">RESUME</button></div></div>
<div id="over"><div class="card"><h1>MISSION FAILED</h1><h2>Score: <span id="finalScore">0</span></h2><p>Wave reached: <span id="finalWave">1</span></p><button onclick="location.reload()">PLAY AGAIN</button></div></div>
<div id="hud"><div class="row"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">WAVE <span id="wave">1</span></div><div class="pill">XP <span id="xp">0</span></div><div class="pill">HP <span id="hp">100</span></div><div id="bar"><div class="fill" id="healthbar"></div></div></div></div>
<div id="ammo">12 / 60</div><div id="msg"></div>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault();if(e.key.toLowerCase()==='r')reload();if(e.key.toLowerCase()==='p'&&running)togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let running=false,paused=false,last=0,score=0,wave=1,xp=0,spawnTimer=0,shots=0;
let player,bullets=[],enemies=[],particles=[],pickups=[],boss=null;
function start(){document.getElementById('menu').style.display='none';running=true;player={x:W/2,y:H/2,r:17,speed:3.7,hp:100,maxHp:100,ammo:12,reserve:60,maxAmmo:12,fire:0,reload:0,damage:25};newWave();requestAnimationFrame(loop)}
function newWave(){wave++;if(wave===2)wave=1; // first displayed wave
 const count=5+wave*3;spawnTimer=0;player.hp=Math.min(player.maxHp,player.hp+10);show('WAVE '+wave);if(wave%5===0){boss={x:W/2,y:-70,r:48,hp:600+wave*80,maxHp:600+wave*80,speed:0.8};show('BOSS INCOMING')}}
function show(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,900)}
function reload(){if(!running||paused||player.reload>0||player.ammo===player.maxAmmo||player.reserve<=0)return;player.reload=55}
function shoot(){if(!running||paused||player.reload>0||player.fire>0)return;if(player.ammo<=0){reload();return}player.ammo--;player.fire=8;const a=Math.atan2(mouse.y-player.y,mouse.x-player.x),spread=(Math.random()-.5)*.06;const ang=a+spread;bullets.push({x:player.x+Math.cos(ang)*22,y:player.y+Math.sin(ang)*22,vx:Math.cos(ang)*11,vy:Math.sin(ang)*11,r:4,damage:player.damage});burst(player.x,player.y,3,'#ffd34d')}
function spawnEnemy(){const side=Math.floor(Math.random()*4),x=side<2?(side?W+40:-40):Math.random()*W,y=side<2?Math.random()*H:(side?H+40:-40);const elite=Math.random()<Math.min(.08+wave*.01,.22);enemies.push({x,y,r:elite?21:15,hp:elite?90+wave*4:40+wave*3,maxHp:elite?90+wave*4:40+wave*3,speed:elite?1.0:1.25+Math.random()*.5,elite})}
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,col})}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt,t){
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));
 if(keys[' ']||mouse.down)shoot();if(player.fire>0)player.fire-=dt;
 if(player.reload>0){player.reload-=dt;if(player.reload<=0){const n=Math.min(player.maxAmmo-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n}}
 spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(10,42-wave*1.2)}
 if(enemies.length>25)enemies.shift();
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
 for(const e of enemies){const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(dist(e,player)<e.r+player.r){player.hp-=e.elite?0.7:0.35;burst(player.x,player.y,1,'#ff6688')}}
 if(boss){const a=Math.atan2(player.y-boss.y,player.x-boss.x);boss.y+=Math.min(1,boss.speed)*dt;boss.x+=(Math.cos(a)*boss.speed*.3)*dt;boss.x=Math.max(boss.r,Math.min(W-boss.r,boss.x));if(dist(boss,player)<boss.r+player.r)player.hp-=.9}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(dist(b,e)<b.r+e.r){e.hp-=b.damage;hit=true;burst(b.x,b.y,4,e.elite?'#ff66dd':'#66ccff');if(e.hp<=0){score+=e.elite?30:10;xp+=e.elite?20:8;if(Math.random()<.1)pickups.push({x:e.x,y:e.y,type:Math.random()<.5?'ammo':'heal'});enemies.splice(j,1)}}}if(boss&&!hit&&dist(b,boss)<b.r+boss.r){boss.hp-=b.damage;hit=true;burst(b.x,b.y,5,'#ff55aa');if(boss.hp<=0){score+=500;xp+=100;burst(boss.x,boss.y,50,'#ff55aa');boss=null;show('BOSS DEFEATED')}}if(hit)bullets.splice(i,1)}
 for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];if(dist(p,player)<28){if(p.type==='ammo')player.reserve=Math.min(120,player.reserve+24);else player.hp=Math.min(player.maxHp,player.hp+25);pickups.splice(i,1);show(p.type==='ammo'?'AMMO +24':'HEALTH +25')}}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 if(enemies.length===0&&spawnTimer>0){} if(score>0&&score%250<2){wave++;show('WAVE '+wave)}
 if(player.hp<=0)gameOver();
 document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave;document.getElementById('xp').textContent=xp;document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('healthbar').style.width=Math.max(0,player.hp/player.maxHp*100)+'%';document.getElementById('ammo').textContent=player.reload>0?'RELOADING…':player.ammo+' / '+player.reserve;
}
function draw(t){ctx.fillStyle='#050811';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff08';ctx.lineWidth=1;for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const p of pickups){ctx.fillStyle=p.type==='ammo'?'#ffd34d':'#55e68a';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#08101c';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='ammo'?'A':'+',p.x,p.y+4)}
 for(const b of bullets){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
 for(const e of enemies){ctx.fillStyle=e.elite?'#d84dff':'#ff4d66';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2,3);ctx.fillStyle='#7cff9b';ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2*(e.hp/e.maxHp),3)}
 if(boss){ctx.fillStyle='#ff3bbd';ctx.beginPath();ctx.arc(boss.x,boss.y,boss.r,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(boss.x-55,boss.y-65,110,7);ctx.fillStyle='#ff55aa';ctx.fillRect(boss.x-55,boss.y-65,110*(boss.hp/boss.maxHp),7)}
 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#7fc8ff';ctx.fillRect(0,-5,30,10);ctx.fillStyle='#3b8cff';ctx.beginPath();ctx.arc(0,0,player.r,0,7);ctx.fill();ctx.restore();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1}
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);ctx.moveTo(mouse.x,mouse.y-14);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+14);ctx.stroke()
}
function loop(t){if(!running)return;if(!paused){const dt=Math.min((t-last)/16.67,2);last=t;update(dt,t);draw(t)}else last=t;requestAnimationFrame(loop)}
function togglePause(){if(!running)return;paused=!paused;document.getElementById('pause').style.display=paused?'grid':'none'}
function gameOver(){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('finalWave').textContent=wave;document.getElementById('over').style.display='grid'}
</script>
</body></html>
