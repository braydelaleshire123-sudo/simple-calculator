<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Ops</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e;color:#fff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;cursor:none}#hud{position:fixed;inset:0;pointer-events:none;padding:16px;font-weight:800;text-shadow:0 2px 4px #000}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#111822dd;border:1px solid #ffffff22;border-radius:9px;padding:8px 11px}#bar{width:170px;height:11px;background:#252525;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#5bdd83}#ammo{position:fixed;right:20px;bottom:18px;font-size:28px;text-shadow:0 2px 5px #000}#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:28px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;transition:.15s}#menu,#pause,#over{position:fixed;inset:0;display:grid;place-items:center;background:#000b;text-align:center}.card{width:min(570px,90vw);padding:34px;border:1px solid #ffffff22;background:#111720f2;border-radius:20px;box-shadow:0 20px 80px #000}h1{font-size:46px;margin:0 0 8px}p{opacity:.8}button{padding:12px 22px;border:0;border-radius:9px;font-weight:900;font-size:16px;cursor:pointer;margin:5px}.small{font-size:13px;opacity:.65}#pause,#over{display:none}</style></head>
<body><canvas id="game"></canvas>
<div id="menu"><div class="card"><h1>HUMAN OPS</h1><p>A tactical top-down shooter with human-style characters, changing weapons, waves, and bosses.</p><button onclick="start()">START</button><p class="small">WASD / arrows · mouse aim · click / space fire · R reload · P pause</p></div></div>
<div id="pause"><div class="card"><h1>PAUSED</h1><button onclick="togglePause()">RESUME</button></div></div>
<div id="over"><div class="card"><h1>MISSION OVER</h1><h2>Score: <span id="finalScore">0</span></h2><p>Wave: <span id="finalWave">1</span></p><button onclick="location.reload()">PLAY AGAIN</button></div></div>
<div id="hud"><div class="row"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">WAVE <span id="wave">1</span></div><div class="pill">HP <span id="hp">100</span></div><div id="bar"><div class="fill" id="healthbar"></div></div></div></div><div id="ammo">15 / 75</div><div id="msg"></div>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault();if(e.key.toLowerCase()==='r')reload();if(e.key.toLowerCase()==='p'&&running)togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let running=false,paused=false,last=0,score=0,wave=0,spawn=0;let player,bullets=[],enemies=[],particles=[],boss=null;
function start(){document.getElementById('menu').style.display='none';running=true;player={x:W/2,y:H/2,speed:3.8,hp:100,maxHp:100,ammo:15,reserve:75,maxAmmo:15,fire:0,reload:0,damage:25,skin:'#c99572',shirt:'#315c83',pants:'#30343a'};newWave();requestAnimationFrame(loop)}
function newWave(){wave++;spawn=0;player.hp=Math.min(100,player.hp+8);show('WAVE '+wave);if(wave%5===0){boss={x:W/2,y:-80,r:30,hp:500+wave*70,maxHp:500+wave*70,speed:.7,skin:'#9a674e',shirt:'#6b3030',pants:'#242424'}}}
function show(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,900)}
function reload(){if(!running||paused||player.reload>0||player.ammo===player.maxAmmo||player.reserve<=0)return;player.reload=55}
function shoot(){if(!running||paused||player.reload>0||player.fire>0)return;if(player.ammo<=0){reload();return}player.ammo--;player.fire=7;const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*19,y:player.y+Math.sin(a)*19,vx:Math.cos(a)*11,vy:Math.sin(a)*11,r:3.5,damage:player.damage})}
function makeEnemy(){const side=Math.floor(Math.random()*4),x=side<2?(side?W+40:-40):Math.random()*W,y=side<2?Math.random()*H:(side?H+40:-40),elite=Math.random()<.13;enemies.push({x,y,hp:elite?95:45,maxHp:elite?95:45,speed:elite?1.0:1.3+Math.random()*.4,elite,skin:['#8b5a3c','#b77b5a','#c99572','#6e4634'][Math.floor(Math.random()*4)],shirt:elite?'#5b2525':['#354a5e','#4d3f35','#394b38'][Math.floor(Math.random()*3)],pants:'#292b30'})}
function burst(x,y,n,col){for(let i=0;i<n;i++){let a=Math.random()*7,s=.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,col})}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(W-20,player.x+dx/l*player.speed*dt));player.y=Math.max(25,Math.min(H-20,player.y+dy/l*player.speed*dt));if(keys[' ']||mouse.down)shoot();if(player.fire>0)player.fire-=dt;if(player.reload>0){player.reload-=dt;if(player.reload<=0){let n=Math.min(player.maxAmmo-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n}}
spawn-=dt;if(spawn<=0){makeEnemy();spawn=Math.max(13,42-wave*1.3)}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(d(e,player)<24)player.hp-=.3}if(boss){let a=Math.atan2(player.y-boss.y,player.x-boss.x);boss.y+=boss.speed*dt;boss.x+=Math.cos(a)*.25*dt;if(d(boss,player)<42)player.hp-=.65}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(d(b,e)<b.r+18){e.hp-=b.damage;hit=true;if(e.hp<=0){score+=e.elite?30:10;enemies.splice(j,1);burst(e.x,e.y,7,'#d7d7d7')}}}if(boss&&!hit&&d(b,boss)<b.r+30){boss.hp-=b.damage;hit=true;if(boss.hp<=0){score+=500;burst(boss.x,boss.y,25,'#d7d7d7');boss=null;show('BOSS DEFEATED')}}if(hit)bullets.splice(i,1)}
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(score>=wave*180)newWave();if(player.hp<=0)gameOver();
document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave;document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('healthbar').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammo').textContent=player.reload>0?'RELOADING…':player.ammo+' / '+player.reserve}
function human(x,y,scale,skin,shirt,pants,aim,enemy=false){
ctx.save();ctx.translate(x,y);ctx.rotate(aim);ctx.scale(scale,scale);
ctx.lineCap='round';ctx.lineJoin='round';
// legs
ctx.strokeStyle='#17191d';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-5,8);ctx.lineTo(-7,24);ctx.moveTo(5,8);ctx.lineTo(7,24);ctx.stroke();
ctx.strokeStyle='#22252a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-8,24);ctx.lineTo(-14,24);ctx.moveTo(8,24);ctx.lineTo(14,24);ctx.stroke();
// torso / jacket
ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-12,-6,24,21,5);ctx.fill();
ctx.fillStyle='#20252b';ctx.fillRect(-3,-5,6,19);
// arms and hands
ctx.strokeStyle=shirt;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-9,-1);ctx.lineTo(-18,6);ctx.moveTo(9,-1);ctx.lineTo(18,6);ctx.stroke();
ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-18,6,3.5,0,7);ctx.arc(18,6,3.5,0,7);ctx.fill();
// neck
ctx.fillStyle=skin;ctx.fillRect(-4,-10,8,6);
// head
ctx.beginPath();ctx.ellipse(0,-17,9,10,0,0,7);ctx.fillStyle=skin;ctx.fill();
// hair
ctx.fillStyle=enemy?'#30251f':'#20242a';ctx.beginPath();ctx.arc(0,-20,9,Math.PI,7);ctx.fill();
ctx.fillRect(-9,-20,18,4);
// face direction / eye
ctx.fillStyle='#111';ctx.beginPath();ctx.arc(4,-17,1.2,0,7);ctx.fill();
// weapon held forward
ctx.fillStyle='#15181b';ctx.fillRect(9,-3,27,5);ctx.fillStyle='#343a40';ctx.fillRect(27,-4,8,7);
ctx.restore()}

function draw(){ctx.fillStyle='#11161b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff09';for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const b of bullets){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);human(e.x,e.y,e.elite?1.25:1,e.skin,e.shirt,e.pants,a,true);ctx.fillStyle='#111';ctx.fillRect(e.x-15,e.y-29,30,3);ctx.fillStyle='#73db8b';ctx.fillRect(e.x-15,e.y-29,30*(e.hp/e.maxHp),3)}if(boss){human(boss.x,boss.y,1.9,boss.skin,boss.shirt,boss.pants,Math.atan2(player.y-boss.y,player.x-boss.x));ctx.fillStyle='#111';ctx.fillRect(boss.x-50,boss.y-60,100,6);ctx.fillStyle='#d65b69';ctx.fillRect(boss.x-50,boss.y-60,100*(boss.hp/boss.maxHp),6)}
human(player.x,player.y,1,player.skin,player.shirt,player.pants,Math.atan2(mouse.y-player.y,mouse.x-player.x));for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1}
ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);ctx.moveTo(mouse.x,mouse.y-14);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+14);ctx.stroke()}
function loop(t){if(!running)return;if(!paused){let dt=Math.min((t-last)/16.67,2);last=t;update(dt);draw()}requestAnimationFrame(loop)}function togglePause(){paused=!paused;document.getElementById('pause').style.display=paused?'grid':'none'}function gameOver(){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('finalWave').textContent=wave;document.getElementById('over').style.display='grid'}
</script></body></html>
