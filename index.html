<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Shooter</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#111;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
  canvas{display:block;background:linear-gradient(#18233a,#0b0f18)}
  #hud{position:fixed;top:14px;left:14px;font-weight:700;font-size:18px;text-shadow:0 2px 3px #000;pointer-events:none}
  #help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);opacity:.8;font-size:14px;pointer-events:none}
  #gameover{position:fixed;inset:0;display:none;place-items:center;background:#0009;text-align:center}
  #gameover div{background:#161b27;padding:28px 36px;border-radius:16px;box-shadow:0 12px 50px #0008}
  button{padding:10px 18px;border:0;border-radius:9px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score: <span id="score">0</span> &nbsp; Health: <span id="health">5</span></div>
<div id="help">Move: WASD / Arrow Keys &nbsp; • &nbsp; Aim: Mouse &nbsp; • &nbsp; Shoot: Click / Space</div>
<div id="gameover"><div><h1>Game Over</h1><p>Score: <span id="final">0</span></p><button onclick="location.reload()">Play Again</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H; function resize(){W=c.width=innerWidth;H=c.height=innerHeight} addEventListener('resize',resize);resize();
const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')shoot()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const mouse={x:W/2,y:H/2,down:false}; addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener('mousedown',()=>{mouse.down=true;shoot()}); addEventListener('mouseup',()=>mouse.down=false);
let player={x:W/2,y:H/2,r:18,speed:4}, bullets=[],enemies=[],score=0,health=5,over=false,spawn=0,last=0;
function shoot(){if(over)return;let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*10,vy:Math.sin(a)*10,r:5})}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side<2?(side?W+30:-30):Math.random()*W,y=side<2?Math.random()*H:(side?H+30:-30);enemies.push({x,y,r:16,s:1.2+Math.random()*1.2})}
function loop(t){if(over)return;let dt=Math.min((t-last)/16.67,2);last=t;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));
 player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));
 if(mouse.down && t%110<18)shoot();
 spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(18,55-score/10)}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt}
 bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt}
 for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];
   if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){enemies.splice(i,1);health--;document.getElementById('health').textContent=health;if(health<=0){over=true;document.getElementById('final').textContent=score;document.getElementById('gameover').style.display='grid';return}continue}
   for(let j=bullets.length-1;j>=0;j--){let b=bullets[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){enemies.splice(i,1);bullets.splice(j,1);score++;document.getElementById('score').textContent=score;break}}
 }
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#18233a';ctx.fillRect(0,0,W,H);
 for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle='#ffd34d';ctx.fill()}
 for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle='#e64b4b';ctx.fill();ctx.strokeStyle='#ff9b9b';ctx.stroke()}
 let a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle='#4da3ff';ctx.fillRect(0,-5,28,10);ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.restore();
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body></html>
