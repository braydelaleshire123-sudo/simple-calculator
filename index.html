<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tank Ops</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e;color:#fff;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;cursor:none}#hud{position:fixed;inset:0;pointer-events:none;padding:16px;font-weight:800;text-shadow:0 2px 4px #000}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#111822dd;border:1px solid #ffffff22;border-radius:9px;padding:8px 11px}#bar{width:170px;height:11px;background:#252525;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#5bdd83}#ammo{position:fixed;right:20px;bottom:18px;font-size:28px;text-shadow:0 2px 5px #000}#msg{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-size:28px;font-weight:900;text-shadow:0 3px 8px #000;opacity:0;transition:.15s}#menu,#pause,#over{position:fixed;inset:0;display:grid;place-items:center;background:#000b;text-align:center}.card{width:min(570px,90vw);padding:34px;border:1px solid #ffffff22;background:#111720f2;border-radius:20px;box-shadow:0 20px 80px #000}h1{font-size:46px;margin:0 0 8px}p{opacity:.8}button{padding:12px 22px;border:0;border-radius:9px;font-weight:900;font-size:16px;cursor:pointer;margin:5px}.small{font-size:13px;opacity:.65}#pause,#over{display:none}</style></head>
<body><canvas id="game"></canvas>
<div id="menu"><div class="card"><h1>TANK OPS</h1><p>A tactical top-down tank battle with waves, armored enemies, and limited ammunition.</p><button onclick="start()">START</button><p class="small">W = forward · S = backward · A/D = turn · mouse aim · click / space fire · R reload · P pause</p></div></div>
<div id="pause"><div class="card"><h1>PAUSED</h1><button onclick="togglePause()">RESUME</button></div></div>
<div id="over"><div class="card"><h1>MISSION OVER</h1><h2>Score: <span id="finalScore">0</span></h2><p>Wave: <span id="finalWave">1</span></p><button onclick="location.reload()">PLAY AGAIN</button></div></div>
<div id="hud"><div class="row"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">WAVE <span id="wave">1</span></div><div class="pill">HP <span id="hp">100</span></div><div id="bar"><div class="fill" id="healthbar"></div></div></div></div><div id="ammo">15 / 75</div><div id="msg"></div>
<script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W,H,DPR;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault();if(e.key.toLowerCase()==='r')reload();if(e.key.toLowerCase()==='p'&&running)togglePause()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
let running=false,paused=false,last=0,score=0,wave=0,spawn=0;let player,bullets=[],enemies=[],particles=[],boss=null,crates=[],powerups=[];
function start(){document.getElementById('menu').style.display='none';running=true;player={x:W/2,y:H/2,speed:3.8,hp:100,maxHp:100,ammo:15,reserve:75,maxAmmo:15,fire:0,reload:0,damage:25,size:1,kills:0,power:'',powerTime:0};newWave();requestAnimationFrame(loop)}
function newWave(){wave++;spawn=0;player.hp=Math.min(100,player.hp+8);show('WAVE '+wave);if(wave%5===0){boss={x:W/2,y:-80,r:30,hp:500+wave*70,maxHp:500+wave*70,speed:.7,skin:'#9a674e',shirt:'#6b3030',pants:'#242424'}}}
function show(t){const m=document.getElementById('msg');m.textContent=t;m.style.opacity=1;setTimeout(()=>m.style.opacity=0,900)}
function reload(){if(!running||paused||player.reload>0||player.ammo===player.maxAmmo||player.reserve<=0)return;player.reload=55}
function shoot(){if(!running||paused||player.reload>0||player.fire>0)return;if(player.ammo<=0){reload();return}player.ammo--;player.fire=7;const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);bullets.push({x:player.x+Math.cos(a)*19,y:player.y+Math.sin(a)*19,vx:Math.cos(a)*11,vy:Math.sin(a)*11,r:3.5,damage:player.damage})}
function makeEnemy(){const side=Math.floor(Math.random()*4),x=side<2?(side?W+50:-50):Math.random()*W,y=side<2?Math.random()*H:(side?H+50:-50),r=Math.random(),type=r<.16?'heavy':r<.42?'medium':'light';const cfg={light:{r:18,hp:45,speed:1.35,score:10,color:'#4f6b3a'},medium:{r:25,hp:115,speed:.9,score:25,color:'#5f6748'},heavy:{r:33,hp:250,speed:.58,score:60,color:'#705442'}}[type];enemies.push({x,y,type,r:cfg.r,hp:cfg.hp,maxHp:cfg.hp,speed:cfg.speed,score:cfg.score,color:cfg.color})}
function burst(x,y,n,col){for(let i=0;i<n;i++){let a=Math.random()*7,s=.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*20,col})}}
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){let dx=(keys.a? -1:0)+(keys.d?1:0),dy=(keys.w? -1:0)+(keys.s?1:0),l=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(W-20,player.x+dx/l*player.speed*dt));player.y=Math.max(25,Math.min(H-20,player.y+dy/l*player.speed*dt));if(keys[' ']||mouse.down)shoot();if(player.power==='rapid')player.fire=Math.max(0,player.fire-0.7*dt);if(player.fire>0)player.fire-=dt;if(player.reload>0){player.reload-=dt;if(player.reload<=0){let n=Math.min(player.maxAmmo-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n}}
spawn-=dt;if(spawn<=0){makeEnemy();spawn=Math.max(13,42-wave*1.3)}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
for(const e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(d(e,player)<e.r+18)player.hp-=(player.power==='armor'?.08:.25)}if(boss){let a=Math.atan2(player.y-boss.y,player.x-boss.x);boss.y+=boss.speed*dt;boss.x+=Math.cos(a)*.25*dt;if(d(boss,player)<42)player.hp-=.65}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],hit=false;for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(d(b,e)<b.r+18){e.hp-=b.damage;hit=true;if(e.hp<=0){score+=e.score;player.kills++;player.size=Math.min(1.7,1+player.kills*.012);enemies.splice(j,1);burst(e.x,e.y,e.type==='heavy'?14:7,'#d7d7d7');if(Math.random()<.2)crates.push({x:e.x,y:e.y,life:600});if(Math.random()<.13)powerups.push({x:e.x,y:e.y,life:700,type:['rapid','armor','mega'][Math.floor(Math.random()*3)]})}}}if(boss&&!hit&&d(b,boss)<b.r+30){boss.hp-=b.damage;hit=true;if(boss.hp<=0){score+=500;burst(boss.x,boss.y,25,'#d7d7d7');boss=null;show('BOSS DEFEATED')}}if(hit)bullets.splice(i,1)}
crates.forEach(q=>{q.life-=dt;if(d(q,player)<30){player.reserve=Math.min(150,player.reserve+30);q.life=0;show('+30 AMMO')}});crates=crates.filter(q=>q.life>0);powerups.forEach(p=>{p.life-=dt;if(d(p,player)<32){p.life=0;player.power=p.type;player.powerTime=500;if(p.type==='rapid')show('RAPID FIRE');if(p.type==='armor'){player.hp=Math.min(player.maxHp,player.hp+35);show('ARMOR REPAIR')}if(p.type==='mega'){player.damage+=15;show('MEGA SHELLS')}}});powerups=powerups.filter(p=>p.life>0);if(player.powerTime>0){player.powerTime-=dt;if(player.powerTime<=0){if(player.power==='mega')player.damage=Math.max(25,player.damage-15);player.power=''}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(score>=wave*180)newWave();if(player.hp<=0)gameOver();
document.getElementById('score').textContent=score;document.getElementById('wave').textContent=wave;document.getElementById('hp').textContent=Math.max(0,Math.ceil(player.hp));document.getElementById('healthbar').style.width=Math.max(0,player.hp)+'%';document.getElementById('ammo').textContent=player.reload>0?'RELOADING…':player.ammo+' / '+player.reserve}
function tank(x,y,scale,body,aim,playerTank=false){ctx.save();ctx.translate(x,y);ctx.rotate(aim);ctx.scale(scale,scale);ctx.fillStyle='#15191c';ctx.fillRect(-20,-14,40,28);ctx.fillStyle=body;ctx.fillRect(-16,-11,32,22);ctx.fillStyle='#283129';ctx.fillRect(-12,-8,24,16);ctx.fillStyle=body;ctx.fillRect(-8,-8,16,16);ctx.fillStyle='#20252a';ctx.fillRect(5,-3,34,6);ctx.fillStyle='#3a4246';ctx.fillRect(30,-5,9,10);ctx.strokeStyle='#0d1114';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-16,-11);ctx.lineTo(-16,11);ctx.moveTo(16,-11);ctx.lineTo(16,11);ctx.stroke();if(playerTank){ctx.strokeStyle='#b9dcff';ctx.lineWidth=2;ctx.strokeRect(-11,-7,22,14)}ctx.restore()}
function draw(){ctx.fillStyle='#11161b';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff09';for(let x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const q of crates){ctx.fillStyle='#d6b94c';ctx.fillRect(q.x-9,q.y-9,18,18);ctx.fillStyle='#242a20';ctx.fillRect(q.x-2,q.y-9,4,18);ctx.fillRect(q.x-9,q.y-2,18,4)}for(const p of powerups){ctx.fillStyle=p.type==='rapid'?'#61d5ff':p.type==='armor'?'#8cff72':'#d77cff';ctx.beginPath();ctx.arc(p.x,p.y,11,0,7);ctx.fill();ctx.fillStyle='#111';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(p.type==='rapid'?'R':p.type==='armor'?'A':'M',p.x,p.y+4)}for(const b of bullets){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}for(const e of enemies){tank(e.x,e.y,e.r/18,e.color,Math.atan2(player.y-e.y,player.x-e.x));ctx.fillStyle='#111';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);ctx.fillStyle='#70d88a';ctx.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.maxHp),4)}if(boss){tank(boss.x,boss.y,1.9,'#7b4037',Math.atan2(player.y-boss.y,player.x-boss.x));ctx.fillStyle='#111';ctx.fillRect(boss.x-55,boss.y-65,110,7);ctx.fillStyle='#d65b69';ctx.fillRect(boss.x-55,boss.y-65,110*(boss.hp/boss.maxHp),7)}tank(player.x,player.y,player.size,'#3f6fa8',Math.atan2(mouse.y-player.y,mouse.x-player.x),true);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1}ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,9,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(mouse.x-14,mouse.y);ctx.lineTo(mouse.x-5,mouse.y);ctx.moveTo(mouse.x+5,mouse.y);ctx.lineTo(mouse.x+14,mouse.y);ctx.moveTo(mouse.x,mouse.y-14);ctx.lineTo(mouse.x,mouse.y-5);ctx.moveTo(mouse.x,mouse.y+5);ctx.lineTo(mouse.x,mouse.y+14);ctx.stroke()}
function loop(t){if(!running)return;if(!paused){let dt=Math.min((t-last)/16.67,2);last=t;update(dt);draw()}requestAnimationFrame(loop)}function togglePause(){paused=!paused;document.getElementById('pause').style.display=paused?'grid':'none'}function gameOver(){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('finalWave').textContent=wave;document.getElementById('over').style.display='grid'}
</script></body></html>
